<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭财务台账</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f5f7fa; padding: 20px; }
        .login-box { max-width: 350px; margin: 100px auto; background: #fff; padding: 30px; border-radius: 12px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2c7be5; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
        .hidden { display: none; }
        .card { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 15px; }
        .summary { display: flex; gap: 10px; margin-bottom: 15px; }
        .summary div { flex: 1; background: #fff; padding: 15px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>
    <!-- 登录页 -->
    <div id="loginPage">
        <div class="login-box">
            <h2>家庭财务台账</h2>
            <p>输入访问秘钥</p>
            <input type="password" id="pwdInput" placeholder="访问秘钥">
            <button onclick="doLogin()">登录</button>
            <p id="errMsg" style="color:red;font-size:13px;"></p>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="mainPage" class="hidden">
        <h1 style="text-align:center;color:#2c7be5;">家庭财务台账</h1>
        <div class="summary">
            <div><small>总收入</small><br><b id="totalIncome">¥0</b></div>
            <div><small>总支出</small><br><b id="totalExpense" style="color:red;">¥0</b></div>
            <div><small>结余</small><br><b id="balance">¥0</b></div>
        </div>
        <div class="card">
            <h3>添加账目</h3>
            <select id="type" style="width:100%;padding:8px;margin:5px 0;">
                <option value="expense">支出</option>
                <option value="income">收入</option>
            </select>
            <input type="number" id="amount" placeholder="金额">
            <input type="text" id="category" placeholder="分类（如：餐饮/工资）">
            <input type="date" id="recordDate">
            <input type="text" id="note" placeholder="备注（可选）">
            <button onclick="addRecord()">保存</button>
        </div>
        <div class="card">
            <h3>记录列表</h3>
            <div id="recordList"></div>
        </div>
        <button onclick="logout()" style="width:auto;padding:8px 20px;">退出</button>
    </div>

<script>
// ========== 只在这里写一次Supabase配置！==========
const SUPABASE_URL = "https://sauzljctykhobanljsam.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_jQkoYsqWc6mfniUw_AI0cg_D-yLQ83u";
const ACCESS_KEY = "123456"; // 网页访问秘钥

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false }
});

let records = [];

// 登录
function doLogin() {
    const pwd = document.getElementById('pwdInput').value.trim();
    if (pwd !== ACCESS_KEY) {
        document.getElementById('errMsg').textContent = '秘钥错误';
        return;
    }
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('mainPage').classList.remove('hidden');
    loadRecords();
}

function logout() {
    document.getElementById('mainPage').classList.add('hidden');
    document.getElementById('loginPage').classList.remove('hidden');
}

// 加载数据
async function loadRecords() {
    const { data, error } = await supabase
        .from('account_records')
        .select('*')
        .order('record_date', { ascending: false });
    
    if (error) {
        alert('加载失败: ' + error.message);
        return;
    }
    records = data || [];
    renderSummary();
    renderList();
}

// 添加记录
async function addRecord() {
    const type = document.getElementById('type').value;
    const amount = parseFloat(document.getElementById('amount').value);
    const category = document.getElementById('category').value;
    const recordDate = document.getElementById('recordDate').value;
    const note = document.getElementById('note').value;

    if (!amount || amount <= 0) { alert('请输入正确金额'); return; }
    if (!recordDate) { alert('请选择日期'); return; }

    const { error } = await supabase
        .from('account_records')
        .insert([{ type, amount, category, record_date: recordDate, note }]);

    if (error) { alert('保存失败: ' + error.message); return; }
    alert('保存成功');
    loadRecords();
}

// 删除记录
async function delRecord(id) {
    if (!confirm('确定删除？')) return;
    await supabase.from('account_records').delete().eq('id', id);
    loadRecords();
}

// 渲染汇总
function renderSummary() {
    let inc = 0, exp = 0;
    records.forEach(r => {
        if (r.type === 'income') inc += Number(r.amount);
        else exp += Number(r.amount);
    });
    document.getElementById('totalIncome').textContent = '¥' + inc.toFixed(2);
    document.getElementById('totalExpense').textContent = '¥' + exp.toFixed(2);
    document.getElementById('balance').textContent = '¥' + (inc - exp).toFixed(2);
}

// 渲染列表
function renderList() {
    const html = records.map(r => `
        <div style="padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;">
            <div>
                <b>${r.category}</b><br>
                <small>${r.record_date} ${r.note || ''}</small>
            </div>
            <div>
                <span style="color:${r.type === 'income' ? 'green' : 'red'}">${r.type === 'income' ? '+' : '-'}¥${r.amount}</span>
                <button onclick="delRecord('${r.id}')" style="margin-left:10px;padding:2px 8px;font-size:12px;">删</button>
            </div>
        </div>
    `).join('');
    document.getElementById('recordList').innerHTML = html || '<p style="color:#999;">暂无记录</p>';
}

// 初始化日期
document.getElementById('recordDate').value = new Date().toISOString().slice(0, 10);
</script>
</body>
</html>
